[package]
name = "entanglement"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
diffy = "0.5.2"
ignore = "0.4.33"
indexmap = { version = "2.14.2", features = ["serde"] }
memchr = "2.8.3"
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
tree-sitter = "0.27.0"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter-loader = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
# Tree-sitter 0.27 and the GCC scanner fix are unreleased upstream: themixednuts/tree-sitter-htmlx#4 and #2.
tree-sitter-htmlx-svelte = { git = "https://github.com/Aunali321/tree-sitter-htmlx", rev = "70ea39cc6c39907a2f683a63602997bd0bf58843" }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
cargo_metadata = "0.23"
tree-sitter-loader = "0.27.0"
