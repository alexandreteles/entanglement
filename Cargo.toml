[package]
name = "entanglement"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
lipgloss = { version = "0.2.4", package = "charmed-lipgloss" }
memchr = "2.8.3"
tree-sitter = "0.27.0"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter-loader = "0.27.0"
tree-sitter-rust = "0.24.2"

[build-dependencies]
serde_json = "1"
tree-sitter-loader = "0.27.0"
