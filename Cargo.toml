[package]
name = "entanglement"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
diffy = "0.5.2"
ignore = "0.4.33"
lipgloss = { version = "0.2.4", package = "charmed-lipgloss" }
memchr = "2.8.3"
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
tree-sitter = "0.27.0"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter-loader = "0.27.0"
tree-sitter-rust = "0.24.2"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
cargo_metadata = "0.23"
tree-sitter-loader = "0.27.0"
