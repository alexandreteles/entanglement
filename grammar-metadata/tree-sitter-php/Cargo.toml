[package]
name = "tree-sitter-php"
version = "0.25.2"
edition = "2024"
license = "MIT"
links = "entanglement_php"
build = "build.rs"

[lib]
path = "lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cargo_metadata = "0.23"
cc = "1.2"
serde_json = "1"
tree-sitter-generate = { version = "=0.27.2", default-features = false, features = ["load"] }
upstream = { package = "tree-sitter-php", git = "https://github.com/tree-sitter/tree-sitter-php", rev = "c1e13490bd656b8869cd47e6f74997ed46750a08" }
