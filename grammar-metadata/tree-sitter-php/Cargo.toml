[package]
name = "tree-sitter-php"
version = "0.25.1"
edition = "2024"
license = "MIT"
links = "entanglement_php"
build = "build.rs"

[lib]
path = "lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cargo_metadata = "0.23"
cc = "1.2"
serde_json = "1"
tree-sitter-generate = { version = "=0.27.1", default-features = false, features = ["load"] }
upstream = { package = "tree-sitter-php", git = "https://github.com/tree-sitter/tree-sitter-php", rev = "58d5643086ae60e93a3746cca648363ee97c8761" }
