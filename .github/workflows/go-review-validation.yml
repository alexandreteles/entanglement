name: Go review validation

on:
  push:
    branches: [fix-go-pr16-review-20261006]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed commit and original PR
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "$GITHUB_SHA" b2335a764e2aebde234b19079ece5c99e52c1e0f
          git checkout --detach "$GITHUB_SHA"
          git worktree add --detach "$RUNNER_TEMP/go-pr16-base" b2335a764e2aebde234b19079ece5c99e52c1e0f
      - name: Select stable Rust and fetch locked metadata dependencies
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
          cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --check
      - name: Run tests
        run: cargo test --locked
      - name: Check lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build Entanglement
        run: cargo build --release --locked
      - name: Measure source and candidate changes with Entanglement
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/review-results"
          baseline="$RUNNER_TEMP/go-pr16-base"
          mkdir -p "$output"
          tool="$PWD/target/release/entanglement"
          "$tool" --metrics cc,cogc,mi --format json repo "$baseline/src" > "$output/before.json"
          "$tool" --metrics cc,cogc,mi --format json repo "$PWD/src" > "$output/after.json"
          git diff b2335a764e2aebde234b19079ece5c99e52c1e0f HEAD -- src > "$output/source.patch"
          "$tool" --metrics cc,cogc,mi --format json candidate "$baseline" --diff "$output/source.patch" > "$output/candidate.json"
          python3 scripts/go_review_metrics.py "$output/before.json" "$output/after.json" --before-root "$baseline" --after-root "$PWD" | tee "$output/summary.json"
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-review-metrics
          path: ${{ runner.temp }}/review-results
          retention-days: 7
