name: Go review validation

on:
  push:
    branches: [fix-go-pr16-review-20261006]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "$GITHUB_SHA" b2335a764e2aebde234b19079ece5c99e52c1e0f
          git checkout --detach "$GITHUB_SHA"
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
      - name: Run tests
        run: cargo test --locked
      - name: Build Entanglement
        run: cargo build --release --locked
      - name: Measure source with Entanglement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-results"
          target/release/entanglement --format json repo src > "$RUNNER_TEMP/review-results/source.json"
          python3 - "$RUNNER_TEMP/review-results/source.json" <<'PY'
          import json, sys
          files = json.load(open(sys.argv[1]))['files']
          functions = [fn for f in files for fn in f['functions']]
          print(json.dumps({'files': len(files), 'nloc': sum(f['nloc'] for f in files), 'functions': len(functions), 'cc': sum(f['cyclomatic_complexity'] for f in functions), 'cogc': sum(f['cognitive_complexity'] for f in functions), 'max_cc': max(f['cyclomatic_complexity'] for f in functions), 'max_cogc': max(f['cognitive_complexity'] for f in functions)}))
          PY
      - name: Prepare isolated offline review tools
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/go-review-tools"
          mkdir -p "$bundle/source" "$bundle/toolchain"
          git archive HEAD | tar -x -C "$bundle/source"
          cargo vendor --locked --versioned-dirs "$bundle/vendor" > "$bundle/vendor-config.toml"
          sysroot="$(rustc --print sysroot)"
          cp -a "$sysroot/bin" "$sysroot/lib" "$bundle/toolchain/"
          rm -rf "$bundle/toolchain/lib/rustlib/src"
          if test -f target/release/entanglement; then
            cp target/release/entanglement "$bundle/entanglement-baseline"
          fi
          tar -czf "$RUNNER_TEMP/go-review-tools.tar.gz" -C "$bundle" .
      - name: Upload offline tools
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-review-tools
          path: ${{ runner.temp }}/go-review-tools.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Upload source metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-review-metrics
          path: ${{ runner.temp }}/review-results
          retention-days: 7
