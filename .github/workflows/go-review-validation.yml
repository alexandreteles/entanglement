name: Go review validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed commit and history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Select baseline and check it out
        id: baseline
        shell: bash
        env:
          EVENT_NAME: "${{ github.event_name }}"
          PR_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          PUSH_BEFORE_SHA: "${{ github.event.before }}"
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              baseline="$PR_BASE_SHA"
              if [[ -z "$baseline" ]]; then
                echo "Pull request base SHA is missing" >&2
                exit 1
              fi
              ;;
            push)
              baseline="$PUSH_BEFORE_SHA"
              ;;
            workflow_dispatch)
              baseline=""
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ -z "$baseline" || "$baseline" =~ ^0+$ ]]; then
            baseline="$(git rev-parse --verify HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          if ! [[ "$baseline" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "Invalid baseline commit SHA" >&2
            exit 1
          fi
          git cat-file -e "${baseline}^{commit}"
          printf 'sha=%s\n' "$baseline" >> "$GITHUB_OUTPUT"
          git worktree add --detach "$RUNNER_TEMP/go-review-base" "$baseline"
      - name: Select stable Rust and fetch locked metadata dependencies
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
          cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --check
      - name: Run tests
        run: cargo test --locked
      - name: Check lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build Entanglement
        run: cargo build --release --locked
      - name: Measure source and candidate changes with Entanglement
        shell: bash
        env:
          BASELINE_SHA: "${{ steps.baseline.outputs.sha }}"
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/review-results"
          baseline="$RUNNER_TEMP/go-review-base"
          mkdir -p "$output"
          tool="$PWD/target/release/entanglement"
          "$tool" --metrics cc,cogc,mi --format json repo "$baseline/src" > "$output/before.json"
          "$tool" --metrics cc,cogc,mi --format json repo "$PWD/src" > "$output/after.json"
          git diff "$BASELINE_SHA" HEAD -- src > "$output/source.patch"
          if [[ -s "$output/source.patch" ]]; then
            "$tool" --metrics cc,cogc,mi --format json candidate "$baseline" --diff "$output/source.patch" > "$output/candidate.json"
          else
            cat > "$output/candidate.json" <<'JSON'
          {
            "status": "skipped",
            "reason": "No source changes in the event diff; candidate analysis requires a non-empty source patch."
          }
          JSON
          fi
          python3 scripts/go_review_metrics.py "$output/before.json" "$output/after.json" --before-root "$baseline" --after-root "$PWD" | tee "$output/summary.json"
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-review-metrics
          path: ${{ runner.temp }}/review-results
          retention-days: 7
